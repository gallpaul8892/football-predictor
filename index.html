<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Predictor — English & Scottish leagues</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap head">
    <div>
      <h1><a href="./" class="home">Football Predictor</a></h1>
      <p class="sub" id="meta">Loading…</p>
    </div>
    <div class="filters">
      <select id="league"><option value="">All leagues</option></select>
      <input id="search" type="search" placeholder="Find a team…">
    </div>
  </div>
  <nav class="wrap tabs" id="tabs">
    <button data-tab="upcoming" class="on">Upcoming</button>
    <button data-tab="review">Last 7 days</button>
    <button data-tab="replay">Replay a date</button>
    <button data-tab="accuracy">Live accuracy</button>
    <button data-tab="backtest">Backtest</button>
    <button data-tab="tables">Tables</button>
    <button data-tab="runs">Run history</button>
    <a href="how-it-works.html">How the model works</a>
    <a href="about.html">About</a>
  </nav>
</header>

<main class="wrap">
  <section id="upcoming" class="tab on"></section>
  <section id="review" class="tab"></section>
  <section id="replay" class="tab"></section>
  <section id="accuracy" class="tab"></section>
  <section id="backtest" class="tab"></section>
  <section id="tables" class="tab"></section>
  <section id="runs" class="tab"></section>
</main>

<footer class="wrap"><a href="./">Predictions</a> · <a href="how-it-works.html">How the model works</a> · <a href="about.html">About</a><br>Data: BBC Sport scores &amp; fixtures. Predictions are statistics for interest — not betting advice.</footer>
<script src="app.js"></script>
<script type="module" src="replay.js"></script>
</body>
</html>
