name: Update (frequent run)

on:
  schedule:
    # 07:23 and 22:47 UTC every day: morning run predicts the day's games,
    # late run grades them once results are in.
    - cron: '23 7 * * *'
    - cron: '47 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull latest results, grade, predict
        run: node scripts/update.mjs
      - name: Commit run output
        run: |
          git config user.name "football-bot"
          git config user.email "football-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update $(date -u +%F)"
          git pull --rebase --autostash
          git push
